    p("circle", { cx: 11, cy: 11, r: 8 }),
    p("path", { strokeLinecap: "round", strokeLinejoin: "round", d: "M21 21l-4.35-4.35" })
  ] });
}
function IconRefresh({ className = "w-4 h-4" }) {
  return p("svg", { className, fill: "none", viewBox: "0 0 24 24", stroke: "currentColor", strokeWidth: 2, children: p("path", { strokeLinecap: "round", strokeLinejoin: "round", d: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" }) });
}
function IconChevronDown({ className = "w-4 h-4" }) {
  return p("svg", { className, fill: "none", viewBox: "0 0 24 24", stroke: "currentColor", strokeWidth: 2, children: p("path", { strokeLinecap: "round", strokeLinejoin: "round", d: "M19 9l-7 7-7-7" }) });
}
function IconAward({ className = "w-4 h-4" }) {
  return v("svg", { className, fill: "none", viewBox: "0 0 24 24", stroke: "currentColor", strokeWidth: 2, children: [
    p("circle", { cx: 12, cy: 8, r: 6 }),
    p("path", { strokeLinecap: "round", strokeLinejoin: "round", d: "M15.477 12.89L17 22l-5-3-5 3 1.523-9.11" })
  ] });
}

// --- MockTestEngine Component ---
function MockTestEngine({ mockTests }) {
  const tests = mockTests || [];
  const [activeTestId, setActiveTestId] = me.useState(tests[0]?.id || "MOCK01");
  const [subjectFilter, setSubjectFilter] = me.useState("All");
  const [difficultyFilter, setDifficultyFilter] = me.useState("All");
  const [searchQuery, setSearchQuery] = me.useState("");
  const [answers, setAnswers] = me.useState({}); // { [testId]: { [qId]: optionLetter } }
  const [isExamMode, setIsExamMode] = me.useState(false);
  const [submitted, setSubmitted] = me.useState({}); // { [testId]: boolean }
  const [bookmarks, setBookmarks] = me.useState({}); // { [qId]: boolean }
  const [filterStarredOnly, setFilterStarredOnly] = me.useState(false);
  const [showPalette, setShowPalette] = me.useState(false);
  const [timerSeconds, setTimerSeconds] = me.useState(5400); // 90 min = 5400s
  const [isTimerRunning, setIsTimerRunning] = me.useState(false);
  const [showSubmitModal, setShowSubmitModal] = me.useState(false);

  const currentTest = me.useMemo(() => {
    return tests.find(t => t.id === activeTestId) || tests[0] || { questions: [] };
  }, [tests, activeTestId]);

  const currentAnswers = answers[activeTestId] || {};
  const isTestSubmitted = !isExamMode || !!submitted[activeTestId];

  // Timer Effect
  me.useEffect(() => {
    let interval = null;
    if (isExamMode && isTimerRunning && timerSeconds > 0) {
      interval = setInterval(() => {
        setTimerSeconds(s => {
          if (s <= 1) {
            setIsTimerRunning(false);
            setSubmitted(prev => ({ ...prev, [activeTestId]: true }));
            return 0;
          }
          return s - 1;
        });
      }, 1000);
    }
    return () => { if (interval) clearInterval(interval); };
  }, [isExamMode, isTimerRunning, timerSeconds, activeTestId]);

  const formatTime = (secs) => {
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  };

  // Stats calculation with FPSC scoring logic: (correct * 1) - (wrong * 0.25)
  const stats = me.useMemo(() => {
    const qs = currentTest.questions || [];
    let correct = 0;
    let wrong = 0;
    let attempted = 0;
    const subjectBreakdown = {};

    qs.forEach(q => {
      const subj = q.subject || "General";
      if (!subjectBreakdown[subj]) {
        subjectBreakdown[subj] = { total: 0, attempted: 0, correct: 0, wrong: 0 };
      }
      subjectBreakdown[subj].total += 1;

      const sel = currentAnswers[q.id];
      if (sel !== undefined && sel !== null && sel !== "") {
        attempted += 1;
        subjectBreakdown[subj].attempted += 1;
        if (sel === q.correct) {
          correct += 1;
          subjectBreakdown[subj].correct += 1;
        } else {
          wrong += 1;
          subjectBreakdown[subj].wrong += 1;
        }
      }
    });

    const total = qs.length || 100;
    const netMarks = (correct * 1.0) - (wrong * 0.25);
    const percentage = total > 0 ? (netMarks / total) * 100 : 0;
    const accuracy = attempted > 0 ? (correct / attempted) * 100 : 0;

    return {
      total,
      attempted,
      unattempted: total - attempted,
      correct,
      wrong,
      netMarks: netMarks.toFixed(2),
      percentage: percentage.toFixed(1),
      accuracy: accuracy.toFixed(1),
      subjectBreakdown
    };
  }, [currentTest, currentAnswers]);

  // Subjects in current test
  const testSubjects = me.useMemo(() => {
    const set = new Set();
    (currentTest.questions || []).forEach(q => {
      if (q.subject) set.add(q.subject);
    });
    return ["All", ...Array.from(set)];
  }, [currentTest]);

  // Filtered Questions
  const filteredQuestions = me.useMemo(() => {
    let list = currentTest.questions || [];
    if (subjectFilter !== "All") {
      list = list.filter(q => q.subject && q.subject.toLowerCase() === subjectFilter.toLowerCase());
    }
    if (difficultyFilter !== "All") {
      list = list.filter(q => q.difficulty && q.difficulty.toLowerCase() === difficultyFilter.toLowerCase());
    }
    if (filterStarredOnly) {
      list = list.filter(q => !!bookmarks[q.id]);
    }
    if (searchQuery.trim()) {
      const qLower = searchQuery.toLowerCase();
      list = list.filter(q =>
        (q.question && q.question.toLowerCase().includes(qLower)) ||
        (q.topic && q.topic.toLowerCase().includes(qLower)) ||
        (q.id && q.id.toLowerCase().includes(qLower)) ||
        (q.explanation && q.explanation.toLowerCase().includes(qLower))
      );
    }
    return list;
  }, [currentTest, subjectFilter, difficultyFilter, filterStarredOnly, searchQuery, bookmarks]);

  const handleSelectOption = (qId, optionLetter) => {
    if (isExamMode && submitted[activeTestId]) return;
    setAnswers(prev => ({
      ...prev,
      [activeTestId]: {
        ...(prev[activeTestId] || {}),
        [qId]: optionLetter
      }
    }));
  };

  const handleClearOption = (qId) => {
    if (isExamMode && submitted[activeTestId]) return;
    setAnswers(prev => {
      const copy = { ...(prev[activeTestId] || {}) };
      delete copy[qId];
      return { ...prev, [activeTestId]: copy };
    });
  };

  const handleToggleBookmark = (qId) => {
    setBookmarks(prev => ({ ...prev, [qId]: !prev[qId] }));
  };

  const handleResetTest = () => {
    if (window.confirm("Reset answers for " + currentTest.title + "?")) {
      setAnswers(prev => ({ ...prev, [activeTestId]: {} }));
      setSubmitted(prev => ({ ...prev, [activeTestId]: false }));
      setTimerSeconds(5400);
      setIsTimerRunning(false);
    }
  };

  const handleSubmitTest = () => {
    setSubmitted(prev => ({ ...prev, [activeTestId]: true }));
    setIsTimerRunning(false);
    setShowSubmitModal(false);
  };

  const scrollToQuestion = (idx) => {
    const el = document.getElementById(`q-card-${activeTestId}-${idx}`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  };

  return v("div", {
    className: "bg-white rounded-[20px] border border-slate-200 shadow-sm p-6 lg:p-8 space-y-6",
    children: [
      // Top Header & Title
      v("div", {
        className: "flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-5",
        children: [
          v("div", {
            className: "space-y-1",
            children: [
              v("div", {
                className: "flex items-center gap-2 font-bold text-[19px] text-slate-900",
                children: [
                  p(IconAward, { className: "text-blue-600 w-5 h-5" }),
                  " FPSC PMD Mock Test Engine (1,000 Questions Series)"
                ]
              }),
              p("div", {
                className: "text-[12.5px] text-slate-500",
                children: "10 Full Mocks • 100 Qs each • Negative Marking (-0.25) • Timed Exam or Practice Mode"
              })
            ]
          }),
          // Practice vs Exam Mode Toggle
          v("div", {
            className: "flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl border border-slate-200 text-[12px] font-medium",
            children: [
              p("button", {
                onClick: () => { setIsExamMode(false); setIsTimerRunning(false); },
                className: `px-3 py-1.5 rounded-lg transition ${!isExamMode ? "bg-white text-blue-700 shadow-sm font-semibold" : "text-slate-600 hover:text-slate-900"}`,
                children: "Practice Mode"
              }),
              p("button", {
                onClick: () => { setIsExamMode(true); setIsTimerRunning(true); },
                className: `px-3 py-1.5 rounded-lg transition ${isExamMode ? "bg-blue-600 text-white shadow-sm font-semibold" : "text-slate-600 hover:text-slate-900"}`,
                children: "Exam Simulation (90m)"
              })
            ]
          })
        ]
      }),

      // Mock Test Selector Tabs & Timer
      v("div", {
        className: "space-y-3",
        children: [
          v("div", {
            className: "flex flex-wrap items-center justify-between gap-3",
            children: [
              p("div", {
                className: "text-[11.5px] font-semibold text-slate-500 uppercase tracking-wide",
                children: "Select Mock Exam (10 Full Tests Available)"
              }),
              isExamMode && v("div", {
                className: "flex items-center gap-2 bg-slate-900 text-white px-3.5 py-1.5 rounded-xl mono text-[13px]",
                children: [
                  p(IconClock, { className: "w-4 h-4 text-amber-400" }),
                  p("span", { className: "font-bold text-amber-300", children: formatTime(timerSeconds) }),
                  p("button", {
                    onClick: () => setIsTimerRunning(!isTimerRunning),
                    className: "ml-2 p-1 hover:bg-slate-800 rounded text-slate-300 hover:text-white transition",
                    title: isTimerRunning ? "Pause Timer" : "Start Timer",
                    children: isTimerRunning ? p(IconPause, { className: "w-3.5 h-3.5" }) : p(IconPlay, { className: "w-3.5 h-3.5" })
                  })
                ]
              })
            ]
          }),

          // Pills for 10 Mock Tests
          p("div", {
            className: "flex gap-2 overflow-x-auto pb-2 scrollbar-none",
            children: tests.map((t, idx) => {
              const isActive = t.id === activeTestId;
              const isSub = !!submitted[t.id];
              return p("button", {
                key: t.id,
                onClick: () => {
                  setActiveTestId(t.id);
                  setSubjectFilter("All");
                  setSearchQuery("");
                },
                className: `shrink-0 px-3.5 py-2 rounded-xl text-[12.5px] border transition flex items-center gap-2 ${
                  isActive
                    ? "bg-blue-600 text-white border-blue-600 shadow-sm font-semibold"
                    : "bg-white border-slate-200 text-slate-700 hover:border-slate-300 hover:bg-slate-50"
                }`,
                children: [
                  p("span", { className: "font-mono font-bold", children: `Mock ${idx + 1}` }),
                  isSub && p("span", { className: "text-[10px] bg-emerald-500/20 px-1.5 py-0.5 rounded text-white", children: "Graded" })
                ]
              });
            })
          })
        ]
      }),

      // Active Test Title & Pattern Banner
      v("div", {
        className: "bg-gradient-to-r from-blue-50/80 to-sky-50/60 border border-blue-100 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3",
        children: [
          v("div", {
            children: [
              v("div", {
                className: "flex items-center gap-2",
                children: [
                  p("span", { className: "text-[11px] mono px-2 py-0.5 rounded bg-blue-600 text-white font-semibold", children: currentTest.id }),
                  p("h3", { className: "font-bold text-[15px] text-blue-900", children: currentTest.title })
                ]
              }),
              v("div", {
                className: "mt-1 flex flex-wrap items-center gap-2 text-[11.5px] text-blue-800/80 mono",
                children: [
                  p("span", { children: `Total: ${currentTest.totalQuestions || 100} Qs` }),
                  p("span", { children: "•" }),
                  p("span", { children: `Duration: ${currentTest.durationMinutes || 90} Mins` }),
                  p("span", { children: "•" }),
                  p("span", { children: "Negative: -0.25 per wrong" }),
                  p("span", { children: "•" }),
                  p("span", { children: `Pattern: ${Object.entries(currentTest.pattern || {}).map(([k, v]) => `${k} (${v})`).join(", ")}` })
                ]
              })
            ]
          }),
          v("div", {
            className: "flex items-center gap-2",
            children: [
              isExamMode && !submitted[activeTestId] && p("button", {
                onClick: () => setShowSubmitModal(true),
                className: "bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-[12.5px] font-semibold shadow-sm transition",
                children: "Submit Test"
              }),
              p("button", {
                onClick: handleResetTest,
                className: "flex items-center gap-1.5 px-3 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-600 text-[12px] font-medium transition",
                title: "Reset current test",
                children: [p(IconRefresh, { className: "w-3.5 h-3.5" }), "Reset"]
              })
            ]
          })
        ]
      }),

      // Scorecard & Summary
      v("div", {
        className: "grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3",
        children: [
          v("div", {
            className: "p-3 rounded-xl bg-slate-50 border border-slate-200 text-center",
            children: [
              p("div", { className: "text-[11px] text-slate-500 font-medium", children: "Net Marks" }),
              p("div", {
                className: `text-[19px] font-bold mono mt-0.5 ${
                  Number(stats.netMarks) >= 50 ? "text-emerald-700" : Number(stats.netMarks) >= 35 ? "text-amber-700" : "text-slate-800"
                }`,
                children: isTestSubmitted ? stats.netMarks : "--"
              })
            ]
          }),
          v("div", {
            className: "p-3 rounded-xl bg-slate-50 border border-slate-200 text-center",
            children: [
              p("div", { className: "text-[11px] text-slate-500 font-medium", children: "Percentage" }),
              p("div", { className: "text-[19px] font-bold text-blue-700 mono mt-0.5", children: isTestSubmitted ? `${stats.percentage}%` : "--" })
            ]
          }),
          v("div", {
            className: "p-3 rounded-xl bg-emerald-50/70 border border-emerald-200 text-center",
            children: [
              p("div", { className: "text-[11px] text-emerald-800 font-medium", children: "Correct (+1)" }),
              p("div", { className: "text-[19px] font-bold text-emerald-700 mono mt-0.5", children: isTestSubmitted ? stats.correct : "--" })
            ]
          }),
          v("div", {
            className: "p-3 rounded-xl bg-rose-50/70 border border-rose-200 text-center",
            children: [
              p("div", { className: "text-[11px] text-rose-800 font-medium", children: "Wrong (-0.25)" }),
              p("div", { className: "text-[19px] font-bold text-rose-700 mono mt-0.5", children: isTestSubmitted ? stats.wrong : "--" })
            ]
          }),
          v("div", {
            className: "p-3 rounded-xl bg-slate-50 border border-slate-200 text-center",
            children: [
              p("div", { className: "text-[11px] text-slate-500 font-medium", children: "Attempted" }),
              p("div", { className: "text-[19px] font-bold text-slate-800 mono mt-0.5", children: `${stats.attempted} / ${stats.total}` })
            ]
          }),
          v("div", {
            className: "p-3 rounded-xl bg-slate-50 border border-slate-200 text-center",
            children: [
              p("div", { className: "text-[11px] text-slate-500 font-medium", children: "Accuracy" }),
              p("div", { className: "text-[19px] font-bold text-indigo-700 mono mt-0.5", children: isTestSubmitted ? `${stats.accuracy}%` : "--" })
            ]
          })
        ]
      }),

      // Question Palette Jump Grid (Collapsible)
      v("div", {
        className: "border border-slate-200 rounded-xl overflow-hidden bg-slate-50/50",
        children: [
          v("button", {
            onClick: () => setShowPalette(!showPalette),
            className: "w-full px-4 py-2.5 flex items-center justify-between text-[12.5px] font-semibold text-slate-700 hover:bg-slate-100 transition",
            children: [
              v("div", {
                className: "flex items-center gap-2",
                children: [
                  p("span", { children: "Quick Question Palette (100 Qs Grid)" }),
                  p("span", { className: "text-[11px] mono text-slate-400", children: `• ${stats.attempted} answered` })
                ]
              }),
              v("div", {
                className: "flex items-center gap-1 text-[11px] text-blue-600",
                children: [
                  showPalette ? "Hide Palette" : "Show Palette",
                  p(IconChevronDown, { className: `w-3.5 h-3.5 transform transition ${showPalette ? "rotate-180" : ""}` })
                ]
              })
            ]
          }),
          showPalette && v("div", {
            className: "p-4 border-t border-slate-200 bg-white",
            children: [
              v("div", {
                className: "grid grid-cols-10 sm:grid-cols-20 gap-1.5 text-center",
                children: (currentTest.questions || []).map((q, idx) => {
                  const sel = currentAnswers[q.id];
                  const hasAnswered = sel !== undefined && sel !== null && sel !== "";
                  const isCorrect = sel === q.correct;
                  const isStarred = !!bookmarks[q.id];

                  let colorClass = "bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100";
                  if (isTestSubmitted) {
                    if (hasAnswered) {
                      colorClass = isCorrect ? "bg-emerald-600 text-white border-emerald-600" : "bg-rose-600 text-white border-rose-600";
                    }
                  } else {
                    if (hasAnswered) {
                      colorClass = "bg-blue-600 text-white border-blue-600";
                    }
                  }

                  return p("button", {
                    key: q.id,
                    onClick: () => scrollToQuestion(idx),
                    className: `h-7 rounded text-[11px] mono font-semibold border transition relative flex items-center justify-center ${colorClass} ${
                      isStarred ? "ring-2 ring-amber-400" : ""
                    }`,
                    title: `Q${idx + 1} (${q.subject})`,
                    children: [
                      idx + 1,
                      isStarred && p("span", { className: "absolute top-0 right-0.5 text-[8px] text-amber-300 font-bold", children: "★" })
                    ]
                  });
                })
              }),
              // Legend
              v("div", {
                className: "mt-3 flex flex-wrap items-center gap-4 text-[11px] text-slate-500 pt-2 border-t border-slate-100",
                children: [
                  v("div", { className: "flex items-center gap-1.5", children: [p("span", { className: "w-3 h-3 rounded bg-slate-100 border border-slate-300" }), " Unattempted"] }),
                  isTestSubmitted
                    ? [
                        v("div", { className: "flex items-center gap-1.5", children: [p("span", { className: "w-3 h-3 rounded bg-emerald-600" }), " Correct (+1)"] }),
                        v("div", { className: "flex items-center gap-1.5", children: [p("span", { className: "w-3 h-3 rounded bg-rose-600" }), " Wrong (-0.25)"] })
                      ]
                    : v("div", { className: "flex items-center gap-1.5", children: [p("span", { className: "w-3 h-3 rounded bg-blue-600" }), " Answered"] }),
                  v("div", { className: "flex items-center gap-1.5", children: [p("span", { className: "w-3 h-3 rounded bg-amber-400" }), " Starred/Review"] })
                ]
              })
            ]
          })
        ]
      }),

      // Filters and Search Bar
      v("div", {
        className: "flex flex-wrap items-center justify-between gap-3 pt-2",
        children: [
          // Subject filter pills
          p("div", {
            className: "flex flex-wrap gap-1.5",
            children: testSubjects.map(sub => {
              const isSel = subjectFilter === sub;
              const count = sub === "All"
                ? (currentTest.questions || []).length
                : (currentTest.questions || []).filter(q => q.subject && q.subject.toLowerCase() === sub.toLowerCase()).length;
              return p("button", {
                key: sub,
                onClick: () => setSubjectFilter(sub),
                className: `text-[12px] px-3 py-1.5 rounded-full border transition flex items-center gap-1.5 ${
                  isSel ? "bg-blue-600 text-white border-blue-600 font-semibold" : "bg-white border-slate-200 text-slate-600 hover:border-slate-300"
                }`,
                children: [
                  sub,
                  p("span", { className: `text-[10.5px] mono px-1.5 py-0.2 rounded-full ${isSel ? "bg-white/20" : "bg-slate-100"}`, children: count })
                ]
              });
            })
          }),

          // Search & Starred filter
          v("div", {
            className: "flex items-center gap-2",
            children: [
              v("div", {
                className: "relative w-[180px] sm:w-[220px]",
                children: [
                  p(IconSearch, { className: "absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-3.5 h-3.5" }),
                  p("input", {
                    type: "text",
                    value: searchQuery,
                    onChange: (e) => setSearchQuery(e.target.value),
                    placeholder: "Search MCQs...",
                    className: "w-full pl-8 pr-3 py-1.5 text-[12px] bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-200"
                  })
                ]
              }),
              p("button", {
                onClick: () => setFilterStarredOnly(!filterStarredOnly),
                className: `p-2 rounded-xl border text-[12px] flex items-center gap-1 transition ${
                  filterStarredOnly ? "bg-amber-100 border-amber-300 text-amber-800" : "bg-white border-slate-200 text-slate-600 hover:bg-slate-50"
                }`,
                title: "Show Starred Questions",
                children: [p(IconStar, { className: "w-4 h-4 text-amber-500", filled: filterStarredOnly })]
              })
            ]
          })
        ]
      }),

      // Question List
      p("div", {
        className: "space-y-4 pt-2",
        children: filteredQuestions.length === 0
          ? p("div", {
              className: "text-center py-12 text-slate-400 text-[13px] border border-dashed border-slate-200 rounded-2xl",
              children: "No questions match your current search/filter."
            })
          : filteredQuestions.map((q, qIndex) => {
              const sel = currentAnswers[q.id];
              const isAnswered = sel !== undefined && sel !== null && sel !== "";
              const isCorrect = sel === q.correct;
              const isStarred = !!bookmarks[q.id];

              let cardBg = "border-slate-200 bg-white";
              if (isTestSubmitted && isAnswered) {
                cardBg = isCorrect ? "border-emerald-300 bg-emerald-50/40" : "border-rose-300 bg-rose-50/40";
              }

              return v("div", {
                key: q.id,
                id: `q-card-${activeTestId}-${qIndex}`,
                className: `rounded-2xl border p-5 transition space-y-4 ${cardBg}`,
                children: [
                  // Card Header: Badge, Difficulty, Stars
                  v("div", {
                    className: "flex items-center justify-between gap-2",
                    children: [
                      v("div", {
                        className: "flex flex-wrap items-center gap-2",
                        children: [
                          p("span", {
                            className: "text-[11.5px] font-bold mono px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200",
                            children: `Q${qIndex + 1} • ${q.id}`
                          }),
                          p("span", {
                            className: "text-[11px] px-2.5 py-0.5 rounded-full bg-blue-50 text-blue-700 border border-blue-200 font-medium",
                            children: q.subject
                          }),
                          q.topic && p("span", {
                            className: "text-[11px] px-2.5 py-0.5 rounded-full bg-slate-50 text-slate-600 border border-slate-200",
                            children: q.topic
                          }),
                          q.difficulty && p("span", {
                            className: `text-[10px] px-2 py-0.5 rounded uppercase font-semibold mono ${
                              q.difficulty === "Easy" ? "text-emerald-700 bg-emerald-50" : q.difficulty === "Medium" ? "text-amber-700 bg-amber-50" : "text-rose-700 bg-rose-50"
                            }`,
                            children: q.difficulty
                          })
                        ]
                      }),
                      v("div", {
                        className: "flex items-center gap-2",
                        children: [
                          isTestSubmitted && isAnswered && p("span", {
                            className: `text-[11px] font-bold px-2.5 py-1 rounded-full ${
                              isCorrect ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                            }`,
                            children: isCorrect ? "+1.00 Correct" : "-0.25 Wrong"
                          }),
                          p("button", {
                            onClick: () => handleToggleBookmark(q.id),
                            className: `p-1.5 rounded-lg border transition ${
                              isStarred ? "bg-amber-100 border-amber-300 text-amber-600" : "bg-white border-slate-200 text-slate-400 hover:text-amber-500"
                            }`,
                            title: isStarred ? "Unstar question" : "Star question for review",
                            children: p(IconStar, { className: "w-3.5 h-3.5", filled: isStarred })
                          }),
                          isAnswered && !isTestSubmitted && p("button", {
                            onClick: () => handleClearOption(q.id),
                            className: "text-[11px] text-slate-400 hover:text-rose-600 px-2 py-1 rounded border border-transparent hover:border-rose-200 hover:bg-rose-50 transition",
                            children: "Clear"
                          })
                        ]
                      })
                    ]
                  }),

                  // Question Text
                  p("div", {
                    className: "font-semibold text-[14.5px] leading-6 text-slate-900",
                    children: q.question
                  }),

                  // Options Grid (A, B, C, D)
                  v("div", {
                    className: "grid sm:grid-cols-2 gap-2.5",
                    children: ["A", "B", "C", "D"].map(optKey => {
                      const optText = (q.options && q.options[optKey]) || "";
                      const isSelected = sel === optKey;
                      const isOptionCorrect = q.correct === optKey;

                      let optBtnClass = "bg-white border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700";
                      let letterBadge = "bg-slate-100 text-slate-700 border-slate-200";

                      if (isTestSubmitted) {
                        if (isSelected && isOptionCorrect) {
                          optBtnClass = "bg-emerald-600 text-white border-emerald-600 font-semibold shadow-sm";
                          letterBadge = "bg-white/20 text-white border-white/40";
                        } else if (isSelected && !isOptionCorrect) {
                          optBtnClass = "bg-rose-600 text-white border-rose-600 font-semibold shadow-sm";
                          letterBadge = "bg-white/20 text-white border-white/40";
                        } else if (isOptionCorrect) {
                          optBtnClass = "bg-emerald-50 border-emerald-300 text-emerald-800 font-semibold";
                          letterBadge = "bg-emerald-200 text-emerald-900 border-emerald-300";
                        }
                      } else {
                        if (isSelected) {
                          optBtnClass = "bg-blue-600 text-white border-blue-600 font-semibold shadow-sm";
                          letterBadge = "bg-white/20 text-white border-white/40";
                        }
                      }

                      return v("button", {
                        key: optKey,
                        onClick: () => handleSelectOption(q.id, optKey),
                        className: `w-full text-left p-3 rounded-xl border text-[13px] flex items-start gap-3 transition ${optBtnClass}`,
                        children: [
                          p("span", {
                            className: `w-6 h-6 rounded-full border flex items-center justify-center text-[11px] font-bold shrink-0 mt-0.5 ${letterBadge}`,
                            children: optKey
                          }),
                          p("span", { className: "flex-1 leading-5", children: optText })
                        ]
                      });
                    })
                  }),

                  // Explanation Box (visible in practice mode or after submit)
                  isTestSubmitted && (isAnswered || !isExamMode) && v("div", {
                    className: "rounded-xl bg-slate-50 border border-slate-200 p-4 text-[12.5px] leading-6 space-y-1.5",
                    children: [
                      v("div", {
                        className: "flex items-center gap-2 font-bold text-slate-800",
                        children: [
                          p("span", { className: "text-emerald-700 font-mono", children: `Correct Answer: Option ${q.correct}` }),
                          p("span", { className: "text-slate-400 font-normal", children: "•" }),
                          p("span", { className: "font-semibold text-slate-600", children: "Explanation" })
                        ]
                      }),
                      p("div", { className: "text-slate-700", children: q.explanation || "No explanation provided." })
                    ]
                  })
                ]
              });
            })
      }),

      // Submission Modal
      showSubmitModal && v("div", {
        className: "fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 backdrop-blur-sm",
        children: v("div", {
          className: "bg-white rounded-2xl max-w-[480px] w-full p-6 shadow-xl space-y-5",
          children: [
            v("div", {
              className: "space-y-2 text-center",
              children: [
                p("div", { className: "w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto", children: p(IconAward, { className: "w-6 h-6" }) }),
                p("h3", { className: "font-bold text-[18px] text-slate-900", children: "Submit Mock Exam?" }),
                p("p", { className: "text-[13px] text-slate-500", children: `You have attempted ${stats.attempted} out of ${stats.total} questions. Unattempted questions will not be penalized (0 marks). Wrong attempts will incur -0.25 negative marking.` })
              ]
            }),
            v("div", {
              className: "bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-3 gap-2 text-center text-[12px]",
              children: [
                v("div", { children: [p("div", { className: "text-slate-500", children: "Attempted" }), p("div", { className: "font-bold text-blue-700 mono text-[16px]", children: stats.attempted })] }),
                v("div", { children: [p("div", { className: "text-slate-500", children: "Unanswered" }), p("div", { className: "font-bold text-slate-700 mono text-[16px]", children: stats.unattempted })] }),
                v("div", { children: [p("div", { className: "text-slate-500", children: "Remaining Time" }), p("div", { className: "font-bold text-amber-700 mono text-[16px]", children: formatTime(timerSeconds) })] })
              ]
            }),
            v("div", {
              className: "flex items-center gap-3 pt-2",
              children: [
                p("button", {
                  onClick: () => setShowSubmitModal(false),
                  className: "flex-1 py-2.5 rounded-xl border border-slate-200 text-slate-700 font-semibold text-[13px] hover:bg-slate-50 transition",
                  children: "Continue Exam"
                }),
                p("button", {
                  onClick: handleSubmitTest,
                  className: "flex-1 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-semibold text-[13px] shadow transition",
                  children: "Submit & Grade Now"
                })
              ]
            })
          ]
        })
      })
    ]
  });

// --- NotesLibrary Component ---
function NotesLibrary({ notesData }) {
  const subjects = notesData?.subjects || [];
  const [activeSubject, setActiveSubject] = me.useState("all");
  const [searchQuery, setSearchQuery] = me.useState("");
  const [expandedTopics, setExpandedTopics] = me.useState({});
  const [expandedTips, setExpandedTips] = me.useState({ english: true });

  const toggleTopic = (id) => {
    setExpandedTopics(prev => ({ ...prev, [id]: !prev[id] }));
  };
  const toggleTip = (id) => {
    setExpandedTips(prev => ({ ...prev, [id]: !prev[id] }));
  };

  const filteredSubjects = me.useMemo(() => {
    let list = subjects;
    if (activeSubject !== "all") {
      list = list.filter(s => s.id === activeSubject);
    }
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      list = list.map(s => {
        const matchesSubject = s.name.toLowerCase().includes(q);
        const filteredTopics = (s.topics || []).filter(t => {
          return (
            (t.topic && t.topic.toLowerCase().includes(q)) ||
            (t.keyPoints && t.keyPoints.some(kp => kp.toLowerCase().includes(q))) ||
            (t.formulas && t.formulas.some(f => f.toLowerCase().includes(q))) ||
            (t.fpsc_traps && t.fpsc_traps.some(tr => tr.toLowerCase().includes(q))) ||
            (t.pakistanContext && t.pakistanContext.some(pk => pk.toLowerCase().includes(q))) ||
            (t.mustRemember && t.mustRemember.some(m => m.toLowerCase().includes(q)))
          );
        });
        if (matchesSubject || filteredTopics.length > 0) {
          return { ...s, topics: matchesSubject ? s.topics : filteredTopics };
        }
        return null;
      }).filter(Boolean);
    }
    return list;
  }, [subjects, activeSubject, searchQuery]);

  return v("div", {
    className: "space-y-6",
    children: [
      // Header
      v("div", {
        className: "flex flex-wrap items-center justify-between gap-4 bg-white rounded-[20px] border border-slate-200 p-6 shadow-sm",
        children: [
          v("div", {
            className: "space-y-1",
            children: [
              v("div", {
                className: "flex items-center gap-2 font-bold text-[19px] text-slate-900",
                children: [
                  p(IconBook, { className: "text-blue-600 w-5 h-5" }),
                  " Formula & Notes Library - Complete 9 Subjects"
                ]
              }),
              p("div", {
                className: "text-[12.5px] text-slate-500",
                children: "Consolidated high-yield formulas, key points, FPSC trap alerts, and Pakistan-specific climate data"
              })
            ]
          }),
          // Search Box
          v("div", {
            className: "relative w-full sm:w-[280px]",
            children: [
              p(IconSearch, { className: "absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4" }),
              p("input", {
                type: "text",
                value: searchQuery,
                onChange: (e) => setSearchQuery(e.target.value),
                placeholder: "Search formulas, laws, traps...",
                className: "w-full pl-9 pr-4 py-2 text-[12.5px] bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-200"
              })
            ]
          })
        ]
      }),

      // Subject Filter Tabs
      p("div", {
        className: "flex gap-2 overflow-x-auto pb-1 scrollbar-none",
        children: [
          p("button", {
            onClick: () => setActiveSubject("all"),
            className: `shrink-0 px-3.5 py-1.5 rounded-full text-[12px] border transition ${
              activeSubject === "all" ? "bg-slate-900 text-white border-slate-900 font-semibold" : "bg-white border-slate-200 text-slate-600 hover:border-slate-300"
            }`,
            children: `All Subjects (${subjects.length})`
          }),
          ...subjects.map(s => {
            const isSel = activeSubject === s.id;
            return p("button", {
              key: s.id,
              onClick: () => setActiveSubject(s.id),
              className: `shrink-0 px-3.5 py-1.5 rounded-full text-[12px] border transition ${
                isSel ? "bg-blue-600 text-white border-blue-600 font-semibold" : "bg-white border-slate-200 text-slate-600 hover:border-slate-300"
              }`,
              children: s.name
            });
          })
        ]
      }),

      // Subject Cards Grid
      p("div", {
        className: "space-y-6",
        children: filteredSubjects.map(sub => {
          const isTipsExpanded = !!expandedTips[sub.id];

          return v("div", {
            key: sub.id,
            className: "bg-white rounded-[20px] border border-slate-200 shadow-sm p-6 space-y-5",
            children: [
              // Card Top: Title, Weightage, AppliesTo
              v("div", {
                className: "flex flex-wrap items-center justify-between gap-3 border-b border-slate-100 pb-4",
                children: [
                  v("div", {
                    className: "flex items-center gap-3",
                    children: [
                      p("div", {
                        className: "w-10 h-10 rounded-xl bg-blue-50 border border-blue-200 text-blue-700 flex items-center justify-center font-bold text-[14px]",
                        children: sub.name.substring(0, 2).toUpperCase()
                      }),
                      v("div", {
                        children: [
                          p("h3", { className: "font-bold text-[16px] text-slate-900", children: sub.name }),
                          p("div", { className: "text-[11.5px] text-slate-500", children: `Applies to: ${sub.appliesTo}` })
                        ]
                      })
                    ]
                  }),
                  v("div", {
                    className: "flex items-center gap-2",
                    children: [
                      p("span", {
                        className: "text-[11px] mono px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 font-semibold",
                        children: `Weightage: ${sub.weightage}`
                      })
                    ]
                  })
                ]
              }),

              // Exam Tips (if present)
              sub.examTips && sub.examTips.length > 0 && v("div", {
                className: "bg-amber-50/70 border border-amber-200 rounded-xl p-4 space-y-2",
                children: [
                  v("div", {
                    className: "flex items-center justify-between",
                    children: [
                      v("div", {
                        className: "flex items-center gap-2 text-amber-900 font-semibold text-[13px]",
                        children: [p(IconSparkles, { className: "w-4 h-4 text-amber-600" }), " High-Yield FPSC Exam Tips"]
                      }),
                      p("button", {
                        onClick: () => toggleTip(sub.id),
                        className: "text-[11px] text-amber-700 hover:text-amber-900 font-medium",
                        children: isTipsExpanded ? "Collapse Tips" : "Expand Tips"
                      })
                    ]
                  }),
                  isTipsExpanded && p("ul", {
                    className: "space-y-1.5 text-[12px] text-amber-900/90 pl-1",
                    children: sub.examTips.map((tip, idx) => v("li", {
                      key: idx,
                      className: "flex items-start gap-2",
                      children: [p("span", { className: "text-amber-600 font-bold", children: "•" }), p("span", { children: tip })]
                    }))
                  })
                ]
              }),

              // Topics List
              p("div", {
                className: "space-y-4",
                children: (sub.topics || []).map((top, tIdx) => {
                  const topicKey = `${sub.id}-${tIdx}`;
                  const isExpanded = expandedTopics[topicKey] !== false; // expanded by default

                  return v("div", {
                    key: tIdx,
                    className: "border border-slate-200 rounded-xl p-4 bg-slate-50/30 space-y-3",
                    children: [
                      v("div", {
                        className: "flex items-center justify-between cursor-pointer",
                        onClick: () => toggleTopic(topicKey),
                        children: [
                          p("h4", {
                            className: "font-semibold text-[14px] text-slate-800 flex items-center gap-2",
                            children: [
                              p("span", { className: "w-2 h-2 rounded-full bg-blue-600" }),
                              top.topic || `Topic ${tIdx + 1}`
                            ]
                          }),
                          p("span", {
                            className: "text-[11px] text-blue-600 font-medium",
                            children: isExpanded ? "Collapse" : "Expand"
                          })
                        ]
                      }),

                      isExpanded && v("div", {
                        className: "space-y-3 pt-1",
                        children: [
                          // Key Points
                          top.keyPoints && top.keyPoints.length > 0 && p("ul", {
                            className: "space-y-1.5 text-[12.5px] leading-5 text-slate-700",
                            children: top.keyPoints.map((kp, kIdx) => v("li", {
                              key: kIdx,
                              className: "flex items-start gap-2",
                              children: [p("span", { className: "text-blue-500 font-bold", children: "›" }), p("span", { children: kp })]
                            }))
                          }),

                          // Formulas
                          top.formulas && top.formulas.length > 0 && v("div", {
                            className: "bg-blue-50/70 border border-blue-200 rounded-lg p-3 space-y-1 text-[12px] mono text-blue-900",
                            children: [
                              p("div", { className: "font-bold text-[11px] uppercase tracking-wide text-blue-700", children: "Essential Formulas:" }),
                              ...top.formulas.map((f, fIdx) => p("div", { key: fIdx, children: f }))
                            ]
                          }),

                          // FPSC Traps
                          top.fpsc_traps && top.fpsc_traps.length > 0 && v("div", {
                            className: "bg-rose-50/70 border border-rose-200 rounded-lg p-3 space-y-1 text-[12px] text-rose-900",
                            children: [
                              p("div", { className: "font-bold text-[11px] uppercase tracking-wide text-rose-700", children: "⚠️ FPSC Traps & Common Confusions:" }),
                              ...top.fpsc_traps.map((tr, trIdx) => p("div", { key: trIdx, children: tr }))
                            ]
                          }),

                          // Pakistan Context
                          top.pakistanContext && top.pakistanContext.length > 0 && v("div", {
                            className: "bg-emerald-50/70 border border-emerald-200 rounded-lg p-3 space-y-1 text-[12px] text-emerald-900",
                            children: [
                              p("div", { className: "font-bold text-[11px] uppercase tracking-wide text-emerald-700", children: "🇵🇰 Pakistan Context & Meteorological Facts:" }),
                              ...top.pakistanContext.map((pk, pkIdx) => p("div", { key: pkIdx, children: pk }))
                            ]
                          }),

                          // Must Remember
                          top.mustRemember && top.mustRemember.length > 0 && v("div", {
                            className: "bg-violet-50/70 border border-violet-200 rounded-lg p-3 space-y-1 text-[12px] text-violet-900",
                            children: [
                              p("div", { className: "font-bold text-[11px] uppercase tracking-wide text-violet-700", children: "💡 Must-Remember Mnemonic / Fact:" }),
                              ...top.mustRemember.map((mr, mrIdx) => p("div", { key: mrIdx, children: mr }))
                            ]
                          })
                        ]
                      })
                    ]
                  });
                })
              })
            ]
          });
        })
      })
    ]
  });
}
